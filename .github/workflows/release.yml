name: Release

# 推一个 v* 的 tag 就触发：在 GitHub 的 Windows 机器上编译 → 打包 → 挂成 Release 附件。
#
#   git tag v0.1.0
#   git push origin v0.1.0
#
# 打完上面两行，Releases 页面上就会出现带 exe 的下载项，本机一次都不用编。
# （tag 推送后 Releases 里本来就会自动多出 Source code (zip)/(tar.gz)，
#   那两个是 GitHub 对 tag 快照自动打的包，和我们这个附件是两回事。）
on:
  push:
    tags:
      - 'v*'
  # 手动触发：只编译 + 打包，把产物挂成 Actions artifact，**不发 Release**。
  # 改了编译参数（例如静态链接 CRT）时可以先用它把产物验一遍，再决定打不打 tag。
  workflow_dispatch:

# softprops/action-gh-release 要写 Release，必须给 contents: write
permissions:
  contents: write

jobs:
  build:
    name: 编译并发布 Windows 版
    # windows-latest 自带 Visual Studio / MSVC。注意：MSVC 目标**默认动态**链接 CRT，
    # 所以「自带运行时」这句话要靠下面那步的 +crt-static 才成立
    #（本机 GNU 工具链是另一套依赖：libgcc_s_seh-1.dll / libwinpthread-1.dll）。
    runs-on: windows-latest

    steps:
      - name: 取源码
        uses: actions/checkout@v4

      - name: 装 Rust 工具链
        # edition 2024 需要 Rust >= 1.85，stable 就是当前最新稳定版。
        # 本机的 rust-toolchain.toml（锁 Windows GNU）故意没进仓库，不会干扰这里。
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo 依赖
        uses: Swatinem/rust-cache@v2

      - name: 编译命令行 + 图形界面
        # --locked 保证用的是仓库里那份 Cargo.lock，不会偷偷升级依赖
        #
        # ★★ 静态链接 CRT（2026-10-08 加）：MSVC 目标默认**动态**依赖 VCRUNTIME140.dll，
        #    用户机器上没装 Visual C++ 2015-2022 Redistributable 时，双击就报
        #    「找不到 VCRUNTIME140.dll」—— "免安装、不需要额外装 DLL" 的承诺当场破功。
        #    +crt-static 之后产物才真的自带运行时（验证方法：解析 PE 导入表，
        #    看 VCRUNTIME140.dll 是否消失，见 D:/test/pe_imports.py）。
        # ★  同时必须显式给 --target：否则 RUSTFLAGS 会一并作用到 build script 与
        #    proc-macro 的编译上，官方文档明确建议指定 target 来规避这一点。
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked --features gui --target x86_64-pc-windows-msvc

      - name: 盘点产物的系统依赖（导入表 / 架构 / 子系统 / 主线程栈）
        # 这一步是「用户下载后双击没反应」那类问题的**唯一**自动化防线。
        # 它查四件事，每一条在开发机上都看不出来（运行库、编译器、显卡驱动都装齐了）：
        #   ① 导入表里有没有非 Windows 自带的 DLL（VC++ 运行库 / MinGW 运行库 / 来路不明）；
        #   ② 架构是不是 x64（包名写着 x64-windows，发 x86 会让一部分机器直接起不来）；
        #   ③ 子系统对不对（GUI 版必须 GUI(2)，否则双击先弹一个黑框）；
        #   ④ 主线程栈**有没有被调大**。★ 这条方向反着 —— v0.2.3 曾经把栈提到 16 MB
        #      "求稳"，实测直接把窗口打坏（glutin 枚举不到 GL 配置、永远建不出窗），
        #      脚本头注释有完整的单变量实验记录。
        run: >-
          python .github/scripts/check_pe_imports.py
          target/x86_64-pc-windows-msvc/release/wrepl.exe
          target/x86_64-pc-windows-msvc/release/wrepl-gui.exe

      - name: 冒烟：产物真的能起来
        # 上一步是**静态**检查，这一步是**真跑一次**。
        # 挡的是"编译过了、但在干净机器上根本进不去入口点"这一类：
        # 依赖没带全、子系统写错、栈太小被运行时干掉……开发机上统统发现不了。
        #
        # 两个坑，注释写在这里免得下次再踩：
        # ① `wrepl-gui.exe` 是**图形子系统**进程。用 `> 文件` 直接重定向时
        #    PowerShell **不会等它**，退出码取不到（$LASTEXITCODE 是空的）；
        #    走管道（`| Out-String`）才会等、才有退出码。
        # ② `--selftest` **不开窗**，所以它验不了"窗口能不能建出来"——
        #    那一步依赖显卡驱动（远程桌面 / 基本显示适配器上会失败），
        #    只能在用户机器上才知道。程序对那种情况的处理见
        #    `diag::startup_failure_box`（弹窗说清原因 + 指到命令行版）。
        #    这一步能验的是：PE 能加载、CRT 齐、字体能读、egui 布局能跑、xlsx 读写能用。
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rel = 'target/x86_64-pc-windows-msvc/release'

          # ① 命令行版：能打印版本，说明依赖链、CRT、入口点全部成立
          & "$rel/wrepl.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "wrepl.exe --version 退出码 $LASTEXITCODE" }

          # ② 图形界面版：无窗口自检（真读字体、真跑布局、真跑一次批量 + xlsx 往返）
          New-Item -ItemType Directory -Force -Path smoke/in, smoke/out | Out-Null
          $log = & "$rel/wrepl-gui.exe" --selftest smoke/in smoke/out 2>&1 | Out-String
          Write-Host $log
          if ($LASTEXITCODE -ne 0) { throw "wrepl-gui.exe --selftest 退出码 $LASTEXITCODE" }
          if ($log -notmatch '自检通过') { throw "wrepl-gui.exe --selftest 没有报告通过" }

      - name: 打包（zip + SHA256）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 手动触发时 ref_name 是分支名，可能带 /（会让 zip 路径出错）→ 换成 -
          $ver   = "${{ github.ref_name }}" -replace '/', '-'
          $name  = "wrepl-$ver-x64-windows"
          $stage = "dist/$name"

          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          # ★ 路径注意：显式给了 --target 之后，产物落在 target/<triple>/release/ 下
          Copy-Item target/x86_64-pc-windows-msvc/release/wrepl.exe     "$stage/"
          Copy-Item target/x86_64-pc-windows-msvc/release/wrepl-gui.exe "$stage/"
          Copy-Item README.md                    "$stage/"
          Copy-Item LICENSE                      "$stage/"
          Copy-Item CHANGELOG.md                 "$stage/"

          Compress-Archive -Path "$stage/*" -DestinationPath "dist/$name.zip" -Force

          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "dist/$name.zip.sha256"

          Write-Host "打好了："
          Get-ChildItem dist | Select-Object Name, Length

      # Release 正文 = 本版**重点**（CHANGELOG.md 里该小节开头的引用行） + 下载说明。
      # 明细留在 CHANGELOG.md 里，正文只留一个链接过去 —— Release 页面保持一屏读得完。
      #
      # 抽取逻辑放在仓库里的脚本、由这一步调用，而不是内联在这里，理由只有一个：
      # 脚本本机也能原样复跑，**推 tag 之前就能先看清正文长什么样**（本机 PowerShell
      # 沙箱起不来，内联的 PS 没法本地验证）。
      #
      # ★ 找不到本 tag 的小节、或该小节里没有引用行摘要块，这一步会**失败**（脚本退出码 2）：
      #   宁可发不出去，也不要静默发一个没有更新内容、或正文长得没法看的 Release。
      #   打 tag 之前先在 CHANGELOG.md 顶部补一节 `## [x.y.z] - <日期>`，标题下面紧跟
      #   `> - 新增：……` 这样的引用行，提交后再打 tag。
      - name: 生成 Release 正文
        # 手动触发（非 tag）时没有对应版本小节，跳过 —— 这一步只在发版时跑
        if: github.ref_type == 'tag'
        run: >-
          python .github/scripts/make_release_notes.py
          --version "${{ github.ref_name }}"
          --repo "${{ github.repository }}"
          --out dist/release-notes.md

      - name: 发布到 Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.zip.sha256
          # 正文取自上一步生成的文件。generate_release_notes 会把
          # 「Full Changelog」比对链接追加在正文后面，两者不冲突。
          body_path: dist/release-notes.md
          generate_release_notes: true

      # 手动触发时不留 Release，把产物挂成 artifact 供下载检查（验编译参数用）
      - name: 非 tag 时把产物挂成 artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: wrepl-x64-windows
          path: |
            dist/*.zip
            dist/*.zip.sha256
          retention-days: 7
