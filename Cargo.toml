[package]
name = "wrepl"
version = "0.2.0"
edition = "2024"

[features]
# 图形界面。**默认不编**——CLI 构建完全不拉 eframe/winit/glow，
# 保持命令行工具的编译速度和零 GUI 依赖。
gui = ["dep:eframe", "dep:rfd"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.20"
hex = "0.4.3"
quick-xml = "0.42.0"
sha2 = "0.11.0"
walkdir = "2.5.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

# 仅 GUI 需要。glow 后端（OpenGL）而非 wgpu —— 依赖树更小、离线可编。
eframe = { version = "0.29.1", default-features = false, features = [
    "default_fonts",
    "glow",
], optional = true }
# 原生「选择目录 / 选择文件」对话框
rfd = { version = "0.15.4", optional = true }

[lib]
name = "wrepl"
path = "src/lib.rs"

[[bin]]
name = "wrepl"
path = "src/main.rs"

[[bin]]
name = "wrepl-gui"
path = "src/gui/main.rs"
required-features = ["gui"]
