[package]
name = "wrepl"
version = "0.8.3"
edition = "2024"
# 用 build.rs 把主线程栈预留**钉死在 1 MB** —— 见 build.rs 文件头。
#
# 这里曾经写过"故意没有 build.rs"，因为当时那个 build.rs 是在**调大**栈
# （1 MB → 16 MB），而调大栈会让窗口永远建不出来。方向搞反了：
# 正确做法不是"别碰"，而是"**显式钉死在 1 MB**"，否则 mingw 默认给 2 MB，
# 同一版本的界面版就会比 MSVC 产物慢 2.4 倍（实测 5.5 s vs 2.1 s）。
# 详见 build.rs 文件头与 CHANGELOG [0.2.3]。
build = "build.rs"

[features]
# 图形界面。**默认不编**——CLI 构建完全不拉 eframe/winit/glow，
# 保持命令行工具的编译速度和零 GUI 依赖。
gui = [
    "dep:eframe",
    "dep:rfd",
    "dep:windows",
    "dep:egui_sauge",
    "dep:egui-phosphor",
    "dep:log",
    "dep:serde",
    "dep:serde_json",
]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.20"
hex = "0.4.3"
quick-xml = "0.42.0"
sha2 = "0.11.0"
walkdir = "2.5.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

# 仅 GUI 需要。glow 后端（OpenGL）而非 wgpu —— 依赖树更小、离线可编。
#
# 0.34 起：`App::ui(&mut self, ui, frame)` 成为必需方法（旧的 `update(ctx, frame)`
# 被标记 deprecated 但**仍会被调用**）。迁移第 1 步只补一个空的 `ui`，面板结构不动。
#
# 版本跨到 0.34 的动机：接入 egui_sauge 设计系统（其 v2.0.0 锁 egui/eframe 0.34.1）。
eframe = { version = "0.34", default-features = false, features = [
    "default_fonts",
    "glow",
], optional = true }
# 原生「选择目录 / 选择文件」对话框
rfd = { version = "0.15.4", optional = true }

# 日志门面。**不是给我们自己用的**（我们的日志走 diag 那套，见 src/gui/diag.rs），
# 只为了一件事：把第三方库打的日志接住。
#
# 图形子系统（PE Subsystem = 2）下没有 stderr，库里打的日志默认**全丢**；而
# "窗口建不出来"最要紧的现场恰恰在库里 —— egui_glow 的 painter.rs:150-158 会打
#
#     opengl version: 1.1.0
#     opengl renderer: GDI Generic
#     opengl vendor: Microsoft Corporation
#
# （源码注释写明"这三样在 gl 1.1 上也拿得到"），紧接着 painter.rs:161 才因为
# `gl.version().major < 2` 返回 PainterError。接住这三行，"建窗失败"就从一句
# 干巴巴的报错变成能直接看出**驱动到底给了什么**。
#
# 版本已经随 eframe 进树（Cargo.lock 里是唯一的 0.4.34），提升为直接依赖
# 不会引入第二份。
log = { version = "0.4", optional = true }

# 界面状态持久化（`src/gui/state.rs`）：规则表 / 主题 / 导出设置落一份 JSON。
#
# **为什么破例引入新依赖**：这份状态里装的是自由文本（查找内容、替换为、备注），
# 任何手写的行格式都得自己解决转义、引号、换行、控制字符 —— 那正是最容易写错、
# 又最难被测试覆盖的一段代码。serde_json 是现成且被广泛验证的。
#
# 代价已经核过：`serde` 本来就在依赖树里（Cargo.lock 里是唯一的 1.0.x），
# 新增的编译单元只有 `serde_json` 一个；且**只挂在 `gui` feature 下**，
# 命令行构建一个字节都不多拉。
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.151", optional = true }

# ── 设计系统（迁移第 2 步接入）───────────────────────────────────────────
#
# 用 **path 依赖**而不是 `git = ...`：本机 git 通道被封（只放行
# api.github.com / raw / codeload / crates.io），`git ls-remote github.com`
# 直接 502。源码已按 tag v2.0.0 落在 `../egui_sauge`（与 wrepl 同级）。
# 上游 74 个 warning 暂不处理（用户 2026-10-11 决定：先接受，将来同步上游时一起弄）。
#
# ⚠ 它锁 `egui 0.34.1`，与上面 eframe 0.34 一致 —— 版本再往上错开就会
#   出现"两套 egui 类型不通用"的编译错误。
egui_sauge = { path = "../egui_sauge", optional = true }

# 直接依赖（egui_sauge 未重导出它）：中文字体要拼进
# 「egui 默认 + Phosphor」的字体表里，得自己拿到 Phosphor 的字体数据。
# 版本必须与 egui_sauge 内部一致（0.12），否则字体表里会出现两个 phosphor。
egui-phosphor = { version = "0.12", optional = true }

# Word COM —— **批量打印与导出 PDF** 走这条路。
# 晚期绑定（ProgID + IDispatch），不依赖类型库、不挑 Office 版本。
# 只在 gui feature 下编，CLI 构建完全不拉它。
#
# 注意：引入它之后，「打印 / 导出 PDF」这两项**需要目标机器装 Word**
# （正文替换与页眉替换都不受影响，都是纯 Rust 改 OOXML）。这条边界不要含糊。
#
# 2026-10-19 起页眉替换的 COM 引擎已退役，只剩纯 Rust 一条路 —— 别再把
# 「页眉替换要装 Word」写进文档。
#
# `Win32_Graphics_Printing` + `Win32_Graphics_Gdi`：批量打印页那张打印机
# 下拉表要 `EnumPrintersW`（`PRINTER_INFO_2W` 里带 `DEVMODEW` 指针，
# 所以 Gdi 那条 feature 也躲不开）。
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
], optional = true }

[lib]
name = "wrepl"
path = "src/lib.rs"

# ── 发布构建 ──────────────────────────────────────────────────────────────
# 这个工具的热点全在依赖里（quick-xml 的解析循环、flate2 的 inflate、
# sha2 的压缩函数、zip 的搬运），跨 crate 内联是唯一能把它们缝进主流程的手段；
# `codegen-units = 1` 再让优化器看见整个 crate。
#
# 刻意**不**开 `panic = "abort"`、也**不**开 `strip`：
#   · 界面版靠 panic 钩子把出错位置与调用栈写进 `%LOCALAPPDATA%\wrepl\wrepl-gui.log`
#     （日志末尾的 `!!! PANIC !!!` 是用户报问题时唯一的线索），
#     `strip` 会把符号表删掉、`panic = "abort"` 会让线程里的 panic 直接带走整个进程；
#   · 这两项省下的那点体积/时间，换不来"崩溃了查不出原因"。
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[[bin]]
name = "wrepl"
path = "src/main.rs"

[[bin]]
name = "wrepl-gui"
path = "src/gui/main.rs"
required-features = ["gui"]

# 诊断用探针：把 wordtool 的 COM 子模块搬进一个**没有 egui 依赖**的 bin，
# 逐步打印每一步 COM 的返回值。只在查「COM 那条路到底断在哪」时用。
# 和 gui 一样挂 `windows` 依赖，所以同样需要 gui feature。
[[bin]]
name = "wt_probe"
path = "src/bin/wt_probe.rs"
required-features = ["gui"]
