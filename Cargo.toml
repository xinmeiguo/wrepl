[package]
name = "wrepl"
version = "0.3.0"
edition = "2024"
# 用 build.rs 把主线程栈预留**钉死在 1 MB** —— 见 build.rs 文件头。
#
# 这里曾经写过"故意没有 build.rs"，因为当时那个 build.rs 是在**调大**栈
# （1 MB → 16 MB），而调大栈会让窗口永远建不出来。方向搞反了：
# 正确做法不是"别碰"，而是"**显式钉死在 1 MB**"，否则 mingw 默认给 2 MB，
# 同一版本的界面版就会比 MSVC 产物慢 2.4 倍（实测 5.5 s vs 2.1 s）。
# 详见 build.rs 文件头与 CHANGELOG [0.2.3]。
build = "build.rs"

[features]
# 图形界面。**默认不编**——CLI 构建完全不拉 eframe/winit/glow，
# 保持命令行工具的编译速度和零 GUI 依赖。
gui = ["dep:eframe", "dep:rfd", "dep:windows"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.20"
hex = "0.4.3"
quick-xml = "0.42.0"
sha2 = "0.11.0"
walkdir = "2.5.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

# 仅 GUI 需要。glow 后端（OpenGL）而非 wgpu —— 依赖树更小、离线可编。
eframe = { version = "0.29.1", default-features = false, features = [
    "default_fonts",
    "glow",
], optional = true }
# 原生「选择目录 / 选择文件」对话框
rfd = { version = "0.15.4", optional = true }

# Word COM —— 页眉替换（文本/图片）与批量打印走这条路。
# 晚期绑定（ProgID + IDispatch），不依赖类型库、不挑 Office 版本。
# 只在 gui feature 下编，CLI 构建完全不拉它。
#
# 注意：引入它之后，「页眉替换 / 批量打印」这两项**需要目标机器装 Word**
# （正文替换不受影响，仍是纯 Rust 改 OOXML）。这条边界不要含糊。
#
# `Win32_Graphics_Printing` + `Win32_Graphics_Gdi`：批量打印页那张打印机
# 下拉表要 `EnumPrintersW`（`PRINTER_INFO_2W` 里带 `DEVMODEW` 指针，
# 所以 Gdi 那条 feature 也躲不开）。
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
], optional = true }

[lib]
name = "wrepl"
path = "src/lib.rs"

# ── 发布构建 ──────────────────────────────────────────────────────────────
# 这个工具的热点全在依赖里（quick-xml 的解析循环、flate2 的 inflate、
# sha2 的压缩函数、zip 的搬运），跨 crate 内联是唯一能把它们缝进主流程的手段；
# `codegen-units = 1` 再让优化器看见整个 crate。
#
# 刻意**不**开 `panic = "abort"`、也**不**开 `strip`：
#   · 界面版靠 panic 钩子把出错位置与调用栈写进 `%LOCALAPPDATA%\wrepl\wrepl-gui.log`
#     （日志末尾的 `!!! PANIC !!!` 是用户报问题时唯一的线索），
#     `strip` 会把符号表删掉、`panic = "abort"` 会让线程里的 panic 直接带走整个进程；
#   · 这两项省下的那点体积/时间，换不来"崩溃了查不出原因"。
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[[bin]]
name = "wrepl"
path = "src/main.rs"

[[bin]]
name = "wrepl-gui"
path = "src/gui/main.rs"
required-features = ["gui"]
